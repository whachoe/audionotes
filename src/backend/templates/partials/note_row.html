<tr id="note-row-{{ note.id }}">
  <td class="col-created"><a href="/notes/{{ note.id }}">{{ note.created_display }}</a></td>
  <td class="col-title"><a href="/notes/{{ note.id }}">{{ note.title_display }}</a></td>
  <td class="col-duration">{{ note.duration_display }}</td>
  <td class="col-status">
    <select
      class="status-select status-{{ note.status }}"
      name="status"
      hx-patch="/partials/notes/{{ note.id }}/status"
      hx-trigger="change"
      hx-target="closest tr"
      hx-swap="outerHTML"
      hx-include="this"
    >
      {% for value, label in all_statuses %}
      <option value="{{ value }}" {% if value == note.status %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </td>
</tr>
